<style>
  :root{

    border:1px solid rgba(255,255,255,.65);background:linear-gradient(165deg,rgba(255,255,255,.66),rgba(255,255,255,.24));box-shadow:0 8px 18px -10px rgba(80,60,160,.5),inset 0 1.5px 0 rgba(255,255,255,.95);transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .2s}

    var dogShown = false;
    function showDog(){
      if(document.querySelector(".intro")){ return void setTimeout(showDog, 6000); } // never over the welcome intro
      if(dogShown || document.hidden) return scheduleDog();
      dogShown = true;
      var ov = document.createElement("div");
      ov.className = "dog-popup-overlay";
      ov.innerHTML = '<div class="dog-popup"><img alt="Our dog in a Santa hat"><p>Merry Christmas, don\'t forget about me</p></div>';
      ov.querySelector("img").src = DOG_SRC;
      document.body.appendChild(ov);
      requestAnimationFrame(function(){ ov.classList.add("show"); });
      var popup = ov.querySelector(".dog-popup");
      // after bounce-in, switch to float
      setTimeout(function(){ popup.classList.add("float"); }, 650);
      function dismiss(){
        popup.classList.remove("float");
        popup.classList.add("out");
        ov.classList.remove("show");
        setTimeout(function(){ ov.remove(); dogShown = false; scheduleDog(); }, 400);
      }
      ov.addEventListener("click", dismiss);
      // auto-dismiss after 5s
      setTimeout(function(){ if(dogShown) dismiss(); }, 5000);
    }
    function scheduleDog(){
      var delay = DOG_MIN + Math.random() * (DOG_MAX - DOG_MIN);
      setTimeout(showDog, delay);
    }
    // first popup: 8–20s after page load
    setTimeout(showDog, 8000 + Math.random() * 12000);
  })();
