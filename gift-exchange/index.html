<style>
  :root{
    --bg:#fff4e6; --card:rgba(255,255,255,.2); --line:rgba(120,70,40,.14); --ink:#2a1d17; --muted:#8a6f60;
    --pine:#c0502b; --pine-soft:#fde4d6; --berry:#a8283a; --gold:#c9962f; --gold-soft:#fbefcf;
    --a1:rgba(255,176,128,.55); --a2:rgba(255,150,170,.42); --a3:rgba(255,214,120,.5);
  }
  *{box-sizing:border-box}
  html,body{overflow-x:hidden;overflow-x:clip;max-width:100%;overscroll-behavior-x:none}
  body{margin:0;min-height:100vh;background:linear-gradient(160deg,#fff7ec 0%,#ffe9d6 55%,#ffdfd2 100%) fixed;color:var(--ink);font:15px/1.55 "Zen Kaku Gothic New",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
    radial-gradient(640px 480px at 8% -6%,var(--a1),transparent 70%),
    radial-gradient(700px 520px at 104% 24%,var(--a2),transparent 70%),
    radial-gradient(580px 440px at 38% 106%,var(--a3),transparent 70%)}
  .wrap{max-width:860px;margin:0 auto;padding:14px 9px 24px}
  h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}

  /* top bar */
  .top{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 26px}
  .top>*:not(.hsnow){position:relative;z-index:1}
  .hsnow{position:absolute!important;left:0;right:0;top:-14px;bottom:-4px;width:100%;height:calc(100% + 18px);pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}
  .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--berry);font-weight:600}
  .top h1{font-size:26px;line-height:1.15}
  .top-r{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .quiet{font:500 12.5px Inter,system-ui,sans-serif;letter-spacing:.01em;color:var(--muted);background:none;border:0;padding:6px 9px;border-radius:8px;cursor:pointer;transition:color .15s,background .15s}
  .quiet:hover{color:var(--ink);background:rgba(120,120,110,.12)}
  .quiet:focus-visible{outline:2px solid var(--pine);outline-offset:1px}
  .eyebrow .bud{color:var(--muted);font-weight:500}
  .eyebrow .sep{margin:0 .55em;opacity:.45}
  @keyframes melt{0%{transform:scale(1,1);opacity:1}30%{transform:scale(1.1,.72);opacity:1}65%{transform:scale(1.5,.2);opacity:.9}100%{transform:scale(2.1,.03);opacity:0}}
  @keyframes summonin{0%{transform:scale(0) rotate(-60deg);opacity:0}38%{transform:scale(1.9) rotate(12deg);opacity:1}58%{transform:scale(.82) rotate(-6deg)}78%{transform:scale(1.18) rotate(3deg)}100%{transform:scale(1) rotate(0);opacity:1}}
  @keyframes halo{0%{transform:scale(.15);opacity:0}22%{opacity:1}100%{transform:scale(1.9);opacity:0}}
  @keyframes ring{0%{transform:scale(.2);opacity:.95}100%{transform:scale(2.4);opacity:0}}
  .sm.summon::before,.sm.summon::after{content:"";position:absolute;left:50%;top:50%;border-radius:50%;pointer-events:none;z-index:-1}
  .sm.summon::before{width:170px;height:170px;margin:-92px 0 0 -85px;background:radial-gradient(circle,rgba(255,236,170,.98),rgba(255,196,96,.55) 38%,rgba(255,170,80,0) 70%);animation:halo 1.7s ease-out both}
  .sm.summon::after{width:90px;height:90px;margin:-67px 0 0 -45px;border:3px solid rgba(255,214,120,.95);box-shadow:0 0 18px rgba(255,200,100,.9);animation:ring 1.2s .1s ease-out both}
  .sm.melt{animation-play-state:paused!important;pointer-events:none}
  .sm.melt svg{animation:melt 1.9s cubic-bezier(.45,.05,.7,.7) forwards!important}
  .sm.summon svg{animation:summonin 1.5s cubic-bezier(.3,1.4,.5,1) both!important}
  body.no-snowman #walk,body.no-snowman .sm,body.no-snowman .sbub{display:none!important}
  /* the snowman lives on the Home page only (not sign in, sign up, profile, match or admin) */
  body.off-home .walk,body.off-home .sm,body.off-home .sbub,body.off-home .print{display:none!important}

  /* tabs */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:26px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{border:0;background:none;font:500 14px Inter,sans-serif;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--pine);border-bottom-color:var(--pine);font-weight:600}

  /* surfaces */
  .card{background:var(--card);border:1px solid rgba(255,255,255,.8);border-radius:20px;padding:26px 24px;margin-bottom:22px;-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);box-shadow:0 8px 24px rgba(150,80,40,.12),inset 0 1px 0 rgba(255,255,255,.9)}
  .card h2{font-size:20px}
  .sub{color:var(--muted);font-size:14px;margin:4px 0 0}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .chip.in{background:var(--pine-soft);color:var(--pine)}
  .chip.out{background:rgba(120,70,40,.08);color:var(--muted)}
  .chip.gold{background:var(--gold-soft);color:#7c5f1c}
  .chip.you{background:var(--ink);color:#fff}

  /* status hero */
  .status{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .status .big{font-family:Fraunces,serif;font-size:40px;line-height:1;color:var(--pine)}
  .status .big small{font-size:18px;color:var(--muted);font-family:Inter,sans-serif;font-weight:500}
  .bar{height:8px;border-radius:99px;background:#efeee9;overflow:hidden;margin-top:10px;min-width:180px}
  .bar>i{display:block;height:100%;background:var(--pine);border-radius:99px;transition:width .4s}
  .grow{flex:1;min-width:200px}

  /* family cards */
  .fams{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;align-items:start}
  .fam{margin:0;padding:0;overflow:hidden}
  .fam-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.35)}
  .fam-h h3{font-size:17px}
  button.fam-h{width:100%;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer;border:0;border-bottom:1px solid var(--line);-webkit-tap-highlight-color:transparent}
  button.fam-h:focus-visible{outline:2px solid var(--pine);outline-offset:-3px}
  .fam-h .count{margin-left:auto}
  .fam-h .chev{flex:none;width:9px;height:9px;margin:0 3px 0 14px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;opacity:.6;transform:translateY(2px) rotate(-135deg);transition:transform .4s cubic-bezier(.34,1.3,.64,1)}
  .fam.closed .fam-h .chev{transform:translateY(-2px) rotate(45deg)}
  .fam.closed .fam-h{border-bottom-color:transparent}
  .fam-b{display:grid;grid-template-rows:1fr;transition:grid-template-rows .38s cubic-bezier(.4,0,.2,1)}
  .fam-bi{min-height:0;overflow:hidden;padding-bottom:6px;transition:opacity .25s ease}
  .fam.closed .fam-b{grid-template-rows:0fr}
  .fam.closed .fam-bi{opacity:0;padding-bottom:0}
  .fam-ctl{display:flex;justify-content:flex-end;margin:0 0 12px}
  .foldall{display:inline-flex;align-items:center;gap:9px;min-height:42px;padding:9px 18px 9px 16px;border-radius:999px;font:600 13.5px Inter,system-ui,sans-serif;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
    border:1px solid rgba(255,255,255,.65);background:linear-gradient(165deg,rgba(255,255,255,.66),rgba(255,255,255,.24));box-shadow:0 8px 18px -10px rgba(80,60,160,.5),inset 0 1.5px 0 rgba(255,255,255,.95);transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .2s}
  .foldall:active{transform:scale(.94)}
  .foldall:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
  .foldall .fa-ico{flex:none;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(2px) rotate(-135deg);transition:transform .4s cubic-bezier(.34,1.3,.64,1)}
  .foldall.allclosed .fa-ico{transform:translateY(-2px) rotate(45deg)}
  body.night .foldall{border-color:rgba(255,255,255,.28);background:linear-gradient(165deg,rgba(255,255,255,.2),rgba(255,255,255,.06));box-shadow:0 8px 18px -10px rgba(0,0,0,.6),inset 0 1.5px 0 rgba(255,255,255,.4)}
  /* frosted "liquid glass" family card (header + member rows keep their own look) */
  .card.fam{position:relative;background:linear-gradient(155deg,rgba(255,255,255,.34),rgba(255,255,255,.08) 55%,rgba(255,255,255,.18));border:1px solid rgba(255,255,255,.55);border-radius:26px;-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);box-shadow:0 14px 40px rgba(120,60,30,.16),0 2px 6px rgba(120,60,30,.08),inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.25),inset 1px 0 0 rgba(255,255,255,.4),inset -1px 0 0 rgba(255,255,255,.2)}
  .card.fam::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 70% at 12% -10%,rgba(255,255,255,.3),transparent 55%),linear-gradient(180deg,rgba(255,255,255,.1),transparent 30%)}
  .card.fam>*{position:relative}
  body.night .card.fam{background:linear-gradient(155deg,rgba(255,255,255,.18),rgba(255,255,255,.04) 55%,rgba(255,255,255,.1));border-color:rgba(255,255,255,.28);box-shadow:0 16px 44px rgba(0,0,0,.45),inset 0 1.5px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.08)}
  .count{font-size:13px;color:var(--muted);font-weight:500}
  .mrow{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid #f1f0eb}
  .mrow:first-of-type{border-top:0}
  .mrow .nm{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere;line-height:1.25}
  .mrow.pending .nm{color:var(--muted);font-weight:400}
  .mrow.pending .avatar{opacity:.5;filter:grayscale(1)}
  .fam{--ix:30px}
  .fam .mrow{background:rgba(255,255,255,.18);border:0;border-radius:14px;margin:8px 14px;padding:12px 16px;gap:14px;min-height:60px}
  .fam .fam-h{padding:16px var(--ix)}
  .fam .mrow .nm{line-height:1.3;padding-top:1px}
  .fam .mrow .chip{white-space:nowrap}
  .chip.joined{background:rgba(46,160,100,.2);color:#1d7a4a}
  body.night .chip.joined{background:rgba(80,210,140,.2);color:#8ce8b4}
  .fam .none{background:rgba(255,255,255,.16);border-radius:12px;margin:10px}
  .org-row{background:rgba(255,255,255,.16);border:0;border-radius:12px;padding:10px 12px;margin-top:8px}
  .wish li{background:rgba(255,255,255,.16);border:0;border-radius:12px;padding:12px 14px;margin-top:8px}
  .wish li::before{margin-top:8px}
  body.night .fam .mrow,body.night .org-row,body.night .wish li,body.night .fam .none{background:rgba(255,255,255,.1)}
  .none{padding:16px 18px;color:var(--muted);font-size:14px}

  /* avatar */
  .avatar{border-radius:50%;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-family:Inter,sans-serif}

  /* forms */
  label{display:block;font-weight:600;font-size:13px;margin:22px 0 9px}
  input[type=text],input[type=password],select{width:100%;font:inherit;padding:12px 14px;border:1px solid rgba(150,90,60,.28);border-radius:12px;background:rgba(255,255,255,.85);color:var(--ink)}
  input:focus,select:focus{outline:2px solid var(--pine);outline-offset:-1px;border-color:var(--pine)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:5px}
  .btn{border:0;font:600 14px Inter,sans-serif;padding:10px 18px;border-radius:10px;cursor:pointer;background:var(--pine);color:#fff}
  .btn:hover{background:#9c4223}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:rgba(255,255,255,.8);color:var(--ink);border:1px solid rgba(150,90,60,.25)}
  .btn.ghost:hover{background:#fff}
  .btn.small{padding:6px 12px;font-size:13px}
  .btn.danger{background:var(--berry);color:#fff;border-color:var(--berry)}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .row>input{flex:1}
  .x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 8px;border-radius:8px;line-height:1}
  .x:hover{background:#f1f0eb;color:var(--berry)}
  .photo-pick{display:flex;align-items:center;gap:16px}
  .locked{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.6);color:var(--ink)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.grid2{grid-template-columns:1fr}}

  /* messages */
  .note{border-radius:10px;padding:10px 14px;font-size:14px;margin:12px 0;background:var(--gold-soft);color:#6a5115}
  .note.err{background:#fbe9ea;color:#7a1d28}
  .note.ok{background:var(--pine-soft);color:var(--pine)}

  /* match */
  .match{text-align:center;padding:32px 20px}
  .match .avatar{margin:0 auto 14px;box-shadow:0 0 0 4px #fff,0 0 0 5px var(--line)}
  .match .tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--berry);font-weight:600;margin:0}
  .match .name{font-family:Fraunces,serif;font-size:30px;font-weight:600;margin:4px 0 10px}
  .wish{list-style:none;margin:12px 0 0;padding:0}
  .wish li{display:flex;gap:12px;padding:12px 0;border-top:1px solid #f1f0eb;word-break:break-word}
  .wish li:first-child{border-top:0}
  .wish li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:9px}
  .wish a{color:var(--pine);font-weight:600;text-decoration:underline;text-underline-offset:3px}
  .empty{text-align:center;padding:36px 20px}
  .empty h2{margin-bottom:6px}
  .org-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #f1f0eb}
  .org-row:first-of-type{border-top:0}
  .org-row .grow{min-width:0}
  .org-row small{color:var(--muted);display:block;font-size:12.5px;margin-top:2px;line-height:1.35}
  .org-row{flex-wrap:wrap;padding:12px 14px!important;gap:10px 12px}
  .org-row .grow{flex:1 1 150px!important;min-width:0;line-height:1.3;overflow-wrap:anywhere}
  .org-row>.btn,.org-row>.chip{flex:none}
  .org-row .btn.small{white-space:nowrap}
  @media (max-width:520px){ .org-row .grow{flex-basis:calc(100% - 56px)!important} .org-row .avatar{align-self:flex-start} .org-row>.btn,.org-row>.chip{margin-left:48px} .org-row>.btn+.btn,.org-row>.btn+.chip{margin-left:0} }
  .pick{display:flex;flex-wrap:wrap;gap:8px}
  .opt{font:500 14px "Zen Kaku Gothic New",Inter,sans-serif;padding:9px 16px;border-radius:999px;border:1px solid rgba(150,90,60,.28);background:rgba(255,255,255,.8);color:var(--ink);cursor:pointer;transition:all .15s}
  .opt:hover{background:#fff;border-color:var(--pine)}
  .opt.on{background:var(--pine);border-color:var(--pine);color:#fff;box-shadow:0 4px 14px rgba(192,80,43,.3)}
  .opt.alt{border-style:dashed;color:var(--muted)}
  .opt.alt.on{color:#fff}
  .fun{--fp:#e0457b;--fg:#f4b72f;position:relative;flex:none;margin:0 0 -1px auto;border:0;background:none;box-shadow:none;cursor:pointer;padding:9px 26px;font:700 15px Inter,sans-serif;letter-spacing:.015em;color:var(--fp);-webkit-tap-highlight-color:transparent}
  body.night .fun{--fp:#ff7fab;--fg:#ffd668}
  @supports((-webkit-background-clip:text) or (background-clip:text)){
    .fun .lbl{background:linear-gradient(100deg,var(--fp) 0%,var(--fp) 40%,var(--fg) 50%,var(--fp) 60%,var(--fp) 100%);background-size:260% 100%;background-position:120% 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  }
  .fun .sp{position:absolute;color:var(--fg);line-height:1;pointer-events:none;text-shadow:0 0 6px rgba(255,205,90,.9)}
  .fun .s1{left:2px;top:3px;font-size:17px}
  .fun .s2{right:3px;bottom:2px;font-size:19px}
  .fun .s3{right:22px;top:0;font-size:12px}
  .fun .s4{left:24px;bottom:0;font-size:11px}
  .fun[aria-selected="true"] .lbl{text-decoration:underline;text-decoration-color:var(--fg);text-decoration-thickness:2px;text-underline-offset:6px}
  .fun:active{transform:scale(.97)}
  .fun:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:12px}
  @media(prefers-reduced-motion:no-preference){
    .fun .lbl{animation:glint 3.4s ease-in-out infinite}
    .fun .sp{animation:twinkle 2.4s ease-in-out infinite}
    .fun .s2{animation-delay:.6s}.fun .s3{animation-delay:1.2s}.fun .s4{animation-delay:1.8s}
    @keyframes glint{0%{background-position:120% 0}55%,100%{background-position:-30% 0}}

      var L = (M + 1.916*Math.sin(M*rad) + 0.020*Math.sin(2*M*rad) + 282.634 + 720) % 360;

    var word = "You\u2019re invited", spans = "", ci = 0;
    for (var wi = 0; wi < word.length; wi++){
      var chh = word.charAt(wi);
      if (chh === " ") { spans += " "; continue; }
      spans += '<tspan class="ch" style="--i:' + (ci++) + '">' + chh + '</tspan>';
    }
    hw.innerHTML = '<svg viewBox="0 0 420 104" aria-hidden="true"><text x="210" y="74" text-anchor="middle" textLength="372" lengthAdjust="spacingAndGlyphs">' + spans + '</text></svg>';
    // waving bear: animated WebP with real alpha (plain <img>, so it plays on every phone without autoplay or video rules)
    var bimg = h("img",{src:"bear2.webp",alt:"","aria-hidden":"true",decoding:"async",draggable:"false"});
    var bearEl = h("div",{class:"bear","aria-hidden":"true"}, bimg);
    var alive = true;
    var el = h("div",{class:"intro",role:"presentation"}, art, cv, h("div",{class:"lbar t"}), h("div",{class:"lbar b"}), bearEl,
      h("div",{class:"txt"}, h("small",null,"Christmas 2026"), hw, h("span",null,"Family Gift Exchange"), h("div",{class:"cred"},"Developed with ", h("span",{class:"lv"},"love"), " by Anand Tsogtbaatar"), h("div",{class:"tap"},"Tap to continue")));
    document.body.appendChild(el);
    var ctx = cv.getContext("2d"), fl = [];
    var sp = [1,1.7,2.6].map(function(r){ var c = document.createElement("canvas"), n = Math.ceil(r*2)+2; c.width = c.height = n; var x = c.getContext("2d"); x.fillStyle = "#fff"; x.beginPath(); x.arc(n/2,n/2,r,0,6.283); x.fill(); return c; });
    for (var i=0;i<(calm?0:80);i++){ var k = i%3; fl.push({x:Math.random()*vw,y:Math.random()*vh,k:k,v:.4+Math.random()*1.0,d:Math.random()*6.28,a:.35+k*.2}); }
    function tick(){
      if (!alive) return;
      requestAnimationFrame(tick);
      if (document.hidden) return;
      ctx.clearRect(0,0,vw,vh);
      for (var i=0;i<fl.length;i++){
        var f = fl[i];
        f.y += f.v; f.d += .012; f.x += Math.sin(f.d)*.45;
        if (f.y > vh+4){ f.y = -4; f.x = Math.random()*vw; }
        var im = sp[f.k]; ctx.globalAlpha = f.a; ctx.drawImage(im, f.x - im.width/2, f.y - im.height/2);
      }
      ctx.globalAlpha = 1;
    }
    if (fl.length) tick();
    var done = false;
    function close(){
      if (done) return; done = true;
      el.classList.add("out");
      setTimeout(function(){ document.dispatchEvent(new CustomEvent("intro-out")); }, 500);
      setTimeout(function(){ alive = false; el.remove(); }, 1600);
    }
    el.addEventListener("click", close);
    document.addEventListener("keydown", function onk(e){ if (e.key === "Enter" || e.key === " " || e.key === "Escape"){ document.removeEventListener("keydown", onk); close(); } });
  }

  // playful snowman: drag it anywhere, poke it and it topples; it guides people to play
  (function snowman(){
    var walk = document.getElementById("walk"), sm = document.getElementById("sman");
    if (!walk || !sm) return;
    var W = 34, H = 44;
    var bub = document.createElement("div"); bub.className = "sbub"; bub.setAttribute("aria-hidden","true"); document.body.appendChild(bub);
    var down = false, moved = false, busy = false, free = false, t0 = 0, offX = 0, offY = 0, px = 0, py = 0, curX = 0, curY = 0;
    var bt = null, idle = null, hintT = null, edge = null, hints = 0, dragged = 0, pokes = 0, interacted = false;
    function docW(){ return Math.max(document.documentElement.scrollWidth, window.innerWidth); }
    function wrapWords(t){
      var w = String(t).split(/\s+/).filter(Boolean), n = w.length;
      if (n <= 5) return w.join(" ");
      var lines = Math.ceil(n/4), base = Math.floor(n/lines), extra = n % lines, out = [], i = 0;
      for (var k = 0; k < lines; k++){ var c = base + (k < extra ? 1 : 0); out.push(w.slice(i, i+c).join(" ")); i += c; }
      return out.join("\n");
    }
    var bx = null, by = null, fol = 0, lastF = 0, stopT = 0;
    function step(dt){
      var r = sm.getBoundingClientRect(); if (!r.width) return;
      var bw = bub.offsetWidth, bh = bub.offsetHeight, cx = r.left + r.width/2;
      var lx = Math.min(Math.max(cx, bw/2 + 8), window.innerWidth - bw/2 - 8);
      var ty = Math.max(r.top - 10, bh + 10);
      if (bx === null){ bx = lx; by = ty; }
      else { var k = 1 - Math.exp(-dt/95); bx += (lx - bx)*k; by += (ty - by)*k; }   // eases after him, so it trails
      bub.style.left = bx + "px"; bub.style.top = by + "px";
      bub.style.setProperty("--tx", Math.min(Math.max(bw/2 + (cx - bx), 30), bw - 30) + "px");
    }
    function loop(ts){ fol = requestAnimationFrame(loop); var dt = Math.min(Math.max(ts - lastF, 0), 64); lastF = ts; step(dt); }
    function startFollow(){ clearTimeout(stopT); if (!fol){ lastF = performance.now(); fol = requestAnimationFrame(loop); } }
    function hideBub(){
      bub.classList.remove("on"); clearTimeout(stopT);
      stopT = setTimeout(function(){ if (!bub.classList.contains("on")){ cancelAnimationFrame(fol); fol = 0; bx = by = null; } }, 500);
    }
    function say(txt, ms){
      clearTimeout(bt); bub.textContent = wrapWords(txt);
      if (!bub.classList.contains("on")) bx = by = null;      // fresh bubble appears right at him
      bub.classList.add("on"); startFollow(); step(0);
      bt = setTimeout(hideBub, ms || 4600);
    }
    function setPos(x, y){
      curX = Math.min(Math.max(x, 0), docW() - W); curY = Math.max(y, 0);
      sm.style.left = curX + "px"; sm.style.top = curY + "px";
    }
    function makeFree(){
      if (free) return;
      var r = sm.getBoundingClientRect();
      document.body.appendChild(sm); free = true;
      sm.classList.add("free");
      setPos(r.left + window.scrollX + (r.width - W)/2, r.top + window.scrollY);
    }
    function flash(cls, ms){ sm.classList.remove(cls); void sm.offsetWidth; sm.classList.add(cls); setTimeout(function(){ sm.classList.remove(cls); }, ms); }
    function armIdle(){ clearTimeout(idle); idle = setTimeout(goHome, 14000); }
    function goHome(){
      if (!free || down || busy) return;
      var wr = walk.getBoundingClientRect();
      var tx = wr.left + window.scrollX + 2, ty = wr.bottom + window.scrollY - H;
      sm.classList.add("home"); setPos(tx, ty);
      say("Home sweet home! ❄️", 3200);
      var fin = false;
      function done(){
        if (fin) return; fin = true;
        sm.classList.remove("home","free","land","up","fall");
        sm.style.left = sm.style.top = "";
        walk.appendChild(sm); free = false;
        if (pokes === 0) scheduleHint();
      }
      sm.addEventListener("transitionend", function te(e){ if (e.propertyName === "top" || e.propertyName === "left"){ sm.removeEventListener("transitionend", te); done(); } });
      setTimeout(done, 1700);
    }
    function poke(){
      if (busy) return; busy = true; pokes++;
      sm.style.setProperty("--d", Math.random() < .5 ? "1" : "-1");
      sm.classList.remove("land","up","nudge"); sm.classList.add("fall");
      var oof = ["Oof! 😵","Ouch! Who poked me?","Whoa… the room is spinning","Timber! 🌲"];
      say(oof[(pokes-1) % oof.length], 2400);
      setTimeout(function(){
        sm.classList.remove("fall"); sm.classList.add("up");
        var back = pokes === 1 ? "Ha! Good one. Now try dragging me up high!" : ["Again! Again!","Okay, okay… I’m dizzy!","Poke me again, I dare you 😏","Hey, I was just standing here!"][pokes % 4];
        say(back, 4400);
        setTimeout(function(){ sm.classList.remove("up"); busy = false; armIdle(); }, 950);
      }, 2000);
    }
    function drop(){
      sm.classList.remove("held"); clearInterval(edge); edge = null;
      flash("land", 560); dragged++;
      say(dragged === 1 ? "Wheee! Now poke me 👉" : ["Nice spot!","Wheee! ✨","Put me anywhere!","Cozy up here ☃️"][dragged % 4], 3800);
      armIdle();
    }
    sm.addEventListener("pointerdown", function(e){
      if (busy) { e.preventDefault(); return; }
      e.preventDefault(); interacted = true; clearTimeout(hintT); clearTimeout(idle);
      hideBub();
      makeFree();
      var r = sm.getBoundingClientRect();
      offX = e.clientX - r.left; offY = e.clientY - r.top; px = e.clientX; py = e.clientY;
      down = true; moved = false; t0 = Date.now();
      try { sm.setPointerCapture(e.pointerId); } catch(_){}
    });
    sm.addEventListener("pointermove", function(e){
      if (!down) return;
      px = e.clientX; py = e.clientY;
      if (!moved){
        var r0 = sm.getBoundingClientRect();
        if (Math.abs(e.clientX - (r0.left + offX)) < 6 && Math.abs(e.clientY - (r0.top + offY)) < 6) return;
        moved = true; sm.classList.add("held");
        edge = setInterval(function(){
          var dy = py < 70 ? -14 : (py > window.innerHeight - 70 ? 14 : 0);
          if (dy){ window.scrollBy(0, dy); setPos(px + window.scrollX - offX, py + window.scrollY - offY); }
        }, 30);
      }
      setPos(e.clientX + window.scrollX - offX, e.clientY + window.scrollY - offY);
    });
    function up(e){
      if (!down) return; down = false;
      try { sm.releasePointerCapture(e.pointerId); } catch(_){}
      if (moved) drop(); else poke();
    }
    sm.addEventListener("pointerup", up);
    sm.addEventListener("pointercancel", up);
    sm.addEventListener("contextmenu", function(e){ e.preventDefault(); });
    document.addEventListener("snowman-say", function(e){ say(e.detail.text, e.detail.ms); });
    // ambient banter: a funny line every so often while he's on screen
    var quips = [
      "I\u2019d tell you a snow joke, but it might go over your head.",
      "Gift budget is $"+BUDGET+". I\u2019m watching. \uD83D\uDC40",
      "Cold hands, warm heart, zero pockets.",
      "Who did I draw? I\u2019d tell you, but I can\u2019t keep a secret\u2026 I mean I CAN. Never mind.",
      "Flurry up and finish your wishlist!",
      "I\u2019m on thin ice with the elves.",
      "Is it just me, or is it getting warm in here?",
      "I asked Santa for a scarf. He said I already have one. Rude.",
      "I\u2019m not saying I\u2019m Santa\u2019s favorite, but I do have a carrot.",
      "Brrr\u2026 I mean, I\u2019m always like this.",
      "Pro tip: gift cards are just snowflakes for grown-ups.",
      "Sleigh the day! \uD83C\uDF84",
      "Why was the snowman cranky? Bad case of ice-itis.",
      "No peeking at the draw! I see you, Uncle.",
      "I put the \u201Csnow\u201D in \u201Csnow way am I telling you who I drew.\u201D",
      "Wrap it with love. Or tape. Mostly tape.",
      "My carrot nose is non-negotiable.",
      "If you get socks, act surprised. It\u2019s tradition."
    ];
    var qi = Math.floor(Math.random()*quips.length), lastSay = 0;
    function banter(){
      var r = sm.getBoundingClientRect(), vis = r.width > 0 && r.bottom > 0 && r.top < window.innerHeight;
      if (vis && !down && !busy && !document.querySelector(".intro") && !document.hidden && Date.now() - lastSay > 6000){
        qi = (qi + 1 + Math.floor(Math.random()*3)) % quips.length;
        lastSay = Date.now();
        say(quips[qi], 4200);
        if (!free) flash("nudge", 720);
      }
      setTimeout(banter, 13000 + Math.random()*11000);
    }
    setTimeout(banter, 9000);
    // guidance: speak up while nobody has played with it yet
    function scheduleHint(){
      clearTimeout(hintT);
      if (interacted && pokes > 0) return;
      hintT = setTimeout(function(){
        var r = sm.getBoundingClientRect(), vis = r.bottom > 0 && r.top < window.innerHeight;
        if (!down && !busy && vis){
          var lines = dragged ? ["Psst… poke me! 👉","Go on, give me a poke"] : ["Psst… drag me around! ✋","Pick me up and take me anywhere!","Tap me… I dare you 😏"];
          say(lines[hints % lines.length], 5000); hints++;
          if (!free) flash("nudge", 720);
        }
        if (hints < 6) scheduleHint();
      }, hints === 0 ? 1600 : 13000);
    }
    if ("IntersectionObserver" in window){
      var io = new IntersectionObserver(function(en){
        if (en[0].isIntersecting && hints === 0 && !interacted){ io.disconnect(); scheduleHint(); }
      }, {threshold:.6});
      io.observe(walk);
    } else scheduleHint();
    // snow trail: stamp soft footprints along the walked path
    var prints = [], lastSX = null, STEP = 15;
    function stamp(x, off){
      var pr = document.createElement("span"); pr.className = "print";
      pr.style.left = x + "px"; pr.style.marginLeft = off + "px";
      walk.appendChild(pr); prints.push(pr);
      pr.addEventListener("animationend", function(){ pr.remove(); var k = prints.indexOf(pr); if (k >= 0) prints.splice(k, 1); });
      while (prints.length > 20){ var old = prints.shift(); if (old) old.remove(); }
    }
    var lastT = 0;
    function trail(t){
      requestAnimationFrame(trail);
      if (document.hidden || t - lastT < 70) return;   // sample ~14x/sec instead of every frame
      lastT = t;
      if (free || down || busy){ lastSX = null; return; }
      var wr = walk.getBoundingClientRect(), r = sm.getBoundingClientRect();
      if (!r.width || wr.bottom < 0 || wr.top > window.innerHeight) { lastSX = null; return; }
      var x = r.left - wr.left + r.width/2;
      if (lastSX === null){ lastSX = x; return; }
      if (Math.abs(x - lastSX) >= STEP){
        var dir = x > lastSX ? 1 : -1; lastSX = x;
        stamp(x - dir*6, (prints.length % 2) ? 3 : -3);
      }
    }
    requestAnimationFrame(trail);
  })();
  intro();
  boot();
})();
